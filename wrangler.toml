name = "skyesthingy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
preview_urls = false # Spotify login only works on the main workers.dev URL

# One cron for everyone. Free plan allows 5 cron triggers per account; we use 1.
[triggers]
crons = ["*/15 * * * *"]

# Static files (profile photos in public/pfp/). Served directly by Cloudflare, free and
# without counting as Worker requests.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "autolist"
database_id = "8b77a341-6c0a-4395-b987-d6251933d629"
migrations_dir = "migrations"

[vars]
PLAYLIST_PREFIX = "Autolist"
# Optional: your Spotify user id (or account_id). If empty, the first account to connect becomes admin.
ADMIN_SPOTIFY_ID = ""

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars for local dev):
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SESSION_SECRET, LASTFM_API_KEY
